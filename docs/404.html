<script>
/* The theme is the system's, unless the visitor turns it. A turn travels to the next
   page in the address (#dark or #light) on this site's own links; nothing is kept,
   and the default carries nothing. */
(function () {
  var root = document.documentElement, system = window.matchMedia('(prefers-color-scheme: dark)'),
      toggle = document.getElementById('themeToggle'), given = location.hash.slice(1);
  function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : system.matches; }
  function carry() {
    var t = root.getAttribute('data-theme'), mark = t && (t === 'dark') !== system.matches ? '#' + t : '';
    [].forEach.call(document.querySelectorAll('a[href]'), function (a) {
      var h = a.getAttribute('href');
      if (!/^([a-z]+:|\/\/|#)/i.test(h)) a.setAttribute('href', h.split('#')[0] + mark);
    });
    if (toggle) toggle.textContent = isDark() ? 'light' : 'dark';
  }
  if (given === 'dark' || given === 'light') root.setAttribute('data-theme', given);
  carry();
  system.addEventListener('change', carry);
  if (toggle) toggle.addEventListener('click', function () {
    root.setAttribute('data-theme', isDark() ? 'light' : 'dark');
    carry();
  });
})();
</script>
